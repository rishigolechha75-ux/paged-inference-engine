name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install -r requirements-dev.txt
      - name: Unit and integration tests (tiny random model)
        run: pytest -q
      - name: CLI smoke test
        run: python -m pagedserve --help

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t pagedserve:ci .
      - name: Import check inside image
        run: docker run --rm pagedserve:ci python -c "import pagedserve.engine, pagedserve.server; print('ok')"
