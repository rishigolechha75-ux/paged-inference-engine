[project]
name = "pagedserve"
version = "0.1.0"
description = "LLM inference engine with a paged KV cache, continuous batching, chunked prefill and prefix caching"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
pagedserve = "pagedserve.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pagedserve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
